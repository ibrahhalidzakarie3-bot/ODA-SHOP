<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin ODA - 2 Secteurs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#eef2f7;padding:12px}
.top{background:#000;color:#E9A800;padding:14px;text-align:center;font-weight:900;border-radius:12px;font-size:18px}
.tabs{display:flex;gap:10px;margin:14px 0}
.tab{flex:1;padding:14px;border-radius:12px;border:2px solid #000;text-align:center;font-weight:900;cursor:pointer;background:#fff}
.tab.active{background:#000;color:#E9A800}
.searchTop{width:100%;padding:14px 18px;border-radius:30px;border:2px solid #E9A800;font-size:16px;background:#fff;margin-bottom:12px}
.box{background:#fff;padding:16px;border-radius:14px;border:1px solid #ddd}
label{font-size:12px;font-weight:800;color:#333;margin-top:12px;display:block}
input,textarea,select{width:100%;padding:12px;margin-top:4px;border-radius:8px;border:1px solid #ccc;font-size:14px}
textarea{height:60px}
.codeAuto{background:#000;color:#E9A800;padding:12px;border-radius:8px;font-weight:900;text-align:center;font-size:22px;letter-spacing:2px;margin-top:6px}
.btn{width:100%;padding:15px;margin-top:14px;border:0;border-radius:10px;font-weight:900;background:#E9A800;font-size:16px;cursor:pointer}
.preview{width:100px;height:100px;object-fit:cover;border-radius:10px;margin-top:8px;display:none;border:2px solid #E9A800}
.prod{background:#f9f9f9;border:1px solid #eee;padding:12px;border-radius:10px;margin-top:10px;display:flex;gap:10px}
.prod img{width:70px;height:70px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<div class="top">ODA SHOP - ADMIN - 2 SECTEURS</div>

<div class="tabs">
  <div class="tab active" id="tNeuve" onclick="setCat('neuve')">🏪 BOUTIQUE NEUVE</div>
  <div class="tab" id="tOcc" onclick="setCat('occasion')">♻️ MARCHÉ OCCASION</div>
</div>

<input class="searchTop" id="searchTop" placeholder="🔍 Rechercher dans ce secteur : ODA001, nom, carte... " oninput="render()">

<div class="box">
  <h3 id="titreSecteur">Ajouter dans Boutique Neuve</h3>
  
  <label>NUMÉRO AUTO MARCHANDISE</label>
  <div class="codeAuto" id="codeAuto">001</div>
  
  <label>Numéro du Sachet</label>
  <input id="sachet" placeholder="Ex: SACH-001">

  <label>Numéro de la Carte de la Personne</label>
  <input id="carte" placeholder="Ex: 123456">

  <label>Nom de la Personne</label>
  <input id="nomPers" placeholder="Ex: Ibrahim">

  <label>Nom de la Marchandise</label>
  <input id="nomMarch" placeholder="Ex: Chemise">

  <label>Description</label>
  <textarea id="desc" placeholder="Description..."></textarea>

  <label>Prix d'Achat</label>
  <input id="pAchat" placeholder="Ex: 3000">

  <label>Prix de Vente</label>
  <input id="pVente" placeholder="Ex: 5000 FCFA">

  <label>Photo de la Personne / Marchandise</label>
  <input id="photo" type="file" accept="image/*" onchange="previewImg(this)">
  <img id="preview" class="preview">

  <label>État de la marchandise</label>
  <select id="statut">
    <option value="En Stock">🟢 En Stock</option>
    <option value="Réservée">🟡 Réservée</option>
    <option value="Vendue">🔴 Vendue</option>
  </select>

  <button class="btn" onclick="ajouter()">✅ AJOUTER DANS <span id="btnCat">NEUVE</span></button>
  <a href="index.html" style="display:block;text-align:center;margin-top:12px;color:#000;font-weight:700">← Retour Boutique Client</a>
</div>

<div class="box" style="margin-top:12px">
  <h3>Liste <span id="listeTitre">Boutique Neuve</span></h3>
  <div id="liste"></div>
</div>

<script>
let cat='neuve';
let photoBase64='';
function setCat(c){
 cat=c;
 tNeuve.classList.toggle('active',c==='neuve');
 tOcc.classList.toggle('active',c==='occasion');
 titreSecteur.innerText = c==='neuve' ? 'Ajouter dans Boutique Neuve' : 'Ajouter dans Marché Occasion';
 btnCat.innerText = c==='neuve' ? 'NEUVE' : 'OCCASION';
 listeTitre.innerText = c==='neuve' ? 'Boutique Neuve' : 'Marché Occasion';
 genCode();
 render();
}
function getAll(){return JSON.parse(localStorage.getItem('produits_complets')||'[]')}
function saveAll(a){localStorage.setItem('produits_complets',JSON.stringify(a))}
function genCode(){
 let all=getAll().filter(p=>p.cat===cat);
 let num=all.length+1;
 let code=String(num).padStart(3,'0');
 codeAuto.innerText=code;
 return code;
}
function previewImg(inp){
 if(inp.files && inp.files[0]){
  let r=new FileReader();
  r.onload=e=>{photoBase64=e.target.result; preview.src=photoBase64; preview.style.display='block';};
  r.readAsDataURL(inp.files[0]);
 }
}
function ajouter(){
 if(!nomMarch.value.trim()){alert('Nom marchandise obligatoire');return;}
 let all=getAll();
 let numAuto=genCode();
 all.push({
  numero:numAuto,
  codeODA:'ODA'+numAuto,
  sachet:sachet.value.trim(),
  carte:carte.value.trim(),
  nomPers:nomPers.value.trim(),
  nomMarch:nomMarch.value.trim(),
  desc:desc.value.trim(),
  pAchat:pAchat.value.trim(),
  pVente:pVente.value.trim(),
  photo:photoBase64,
  statut:statut.value,
  cat:cat,
  date:Date.now()
 });
 saveAll(all);
 sachet.value=''; carte.value=''; nomPers.value=''; nomMarch.value=''; desc.value=''; pAchat.value=''; pVente.value=''; photo.value=''; preview.style.display='none'; photoBase64='';
 genCode(); render();
 alert('Ajouté '+cat+' N°'+numAuto);
}
function suppr(date){
 let all=getAll(); let i=all.findIndex(x=>x.date===date);
 if(i>-1){ all.splice(i,1); saveAll(all); render(); }
}
function render(){
 let q=searchTop.value.toLowerCase();
 let all=getAll().filter(p=>p.cat===cat && (q==='' || (p.numero||'').includes(q) || (p.codeODA||'').toLowerCase().includes(q) || (p.nomMarch||'').toLowerCase().includes(q) || (p.carte||'').toLowerCase().includes(q) || (p.nomPers||'').toLowerCase().includes(q) ));
 if(!all.length){ liste.innerHTML='<div style=padding:20px;text-align:center;color:#888>Aucun produit dans ce secteur</div>'; return; }
 liste.innerHTML=all.map(x=>`
  <div class=prod>
   <img src="${x.photo||'https://via.placeholder.com/70'}">
   <div style=flex:1>
    <b style=color:#E9A800>#${x.numero} - ${x.codeODA}</b> <b>${x.nomMarch}</b> <span style="font-size:11px;color:${x.statut==='En Stock'?'green': x.statut==='Vendue'?'red':'orange'}">${x.statut}</span><br>
    <small>Carte: ${x.carte||'-'} | Pers: ${x.nomPers||'-'} | Sachet: ${x.sachet||'-'}</small><br>
    <small>Achat: ${x.pAchat||'-'} | Vente: ${x.pVente||'-'}</small><br>
    <small>${x.desc||''}</small><br>
    <button onclick="suppr(${x.date})" style="background:#ff4444;color:#fff;border:0;padding:4px 8px;border-radius:5px;margin-top:4px;cursor:pointer">Supprimer</button>
   </div>
  </div>
 `).join('');
}
genCode(); render();
</script>
</body>
</html>
