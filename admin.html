<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN ODA - Secret</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:20px}input,select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0;font-size:16px}button{width:100%;padding:15px;background:#E9A800;border:0;border-radius:30px;font-weight:900;font-size:18px;margin-top:10px} .box{max-width:400px;margin:50px auto;background:#222;padding:20px;border-radius:20px}</style>
</head><body>
<div id="login" class="box"><h2>ODA SHOP ADMIN</h2><p>Mot de passe secret</p><input type="password" id="pass" placeholder="Mot de passe"><button onclick="check()">ENTRER</button><p id="err" style="color:red"></p></div>
<div id="admin" style="display:none" class="box"><h2>Ajouter Produit</h2>
<input id="nom" placeholder="Nom produit"><input id="prix" placeholder="Prix ex: 85000 FCFA">
<select id="cat"><option value="neuve">BOUTIQUE NEUVE</option><option value="occasion">MARCHÉ OCCASION</option></select>
<input id="ville" value="Agadez"><input id="tel" value="22777174950">
<button onclick="ajouter()">AJOUTER - Tout Agadez va voir</button><div id="msg"></div></div>
<script>
function check(){
let p=document.getElementById('pass').value;
if(p==="ODA shop 123?"||p==="ODA shop 123 ?"||p==="ODA2025"||p==="ODA 2025"||p==="oda shop 123?"){
document.getElementById('login').style.display='none';document.getElementById('admin').style.display='block';
}else{document.getElementById('err').innerText='Mot de passe faux';}
}
function ajouter(){
let pr={nom:nom.value,prix:prix.value,categorie:cat.value,ville:ville.value,tel:tel.value};
let all=JSON.parse(localStorage.getItem('oda_produits')||'[]');all.push(pr);localStorage.setItem('oda_produits',JSON.stringify(all));
document.getElementById('msg').innerHTML='<p style="color:#E9A800">✅ Ajouté ! Dans Boutique '+cat.value+'</p>';
}
</script></body></html>
