<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin ODA SHOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#eef2f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
.login{width:100%;max-width:420px;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);text-align:center}
.login h2{font-weight:900;margin-bottom:4px}
.login p{color:#888;font-size:13px;margin-bottom:16px}
.login input{width:100%;padding:14px;border-radius:10px;border:1px solid #cbd5e1;background:#dbeafe;margin-top:10px;font-size:15px}
.login button{width:100%;padding:14px;border-radius:10px;border:0;background:#E9A800;font-weight:900;font-size:16px;margin-top:14px;cursor:pointer}
#dashboard{display:none;width:100%;max-width:700px;background:#fff;padding:16px;border-radius:16px}
.tabs{display:flex;gap:10px;margin:14px 0}
.tab{flex:1;padding:12px;border-radius:10px;border:2px solid #000;text-align:center;font-weight:900;cursor:pointer}
.tab.active{background:#000;color:#E9A800}
.box{border:1px solid #ddd;padding:14px;border-radius:12px;margin-bottom:12px}
.box input{width:100%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #ccc}
.btn{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;font-weight:900;background:#E9A800;cursor:pointer}
.prod{border:1px solid #eee;padding:10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<div class="login" id="loginBox">
  <div style="font-size:28px">📦</div>
  <h2>ODA SHOP Admin</h2>
  <p>Accès sécurisé</p>
  <input id="email" type="email" value="odashop215@gmail.com">
  <input id="pass" type="password" placeholder="Mot de passe" value="123456">
  <button onclick="entrer()">Entrer</button>
</div>

<div id="dashboard">
  <div style="background:#000;color:#E9A800;padding:12px;text-align:center;font-weight:900;border-radius:10px">ODA SHOP - ADMIN 2 SECTEURS</div>
  <div class="tabs">
    <div class="tab active" id="t1" onclick="setCat('neuve')">🏪 BOUTIQUE NEUVE</div>
    <div class="tab" id="t2" onclick="setCat('occasion')">♻️ MARCHÉ OCCASION</div>
  </div>
  <div class="box">
    <h3 id="catTitle">Ajouter Produit Neuf</h3>
    <input id="nom" placeholder="Nom produit">
    <input id="prix" placeholder="Prix ex: 5000 FCFA">
    <input id="img" placeholder="Lien image (optionnel)">
    <button class="btn" onclick="ajouter()">✅ Ajouter</button>
    <a href="index.html" style="display:block;text-align:center;margin-top:10px;color:#000;text-decoration:none">← Retour Accueil</a>
  </div>
  <div class="box"><h3>Produits</h3><div id="liste"></div></div>
</div>

<script>
function entrer(){
  // simple vérif - tu peux changer le mdp ici
  if(email.value.trim()!==''){ 
    loginBox.style.display='none'; 
    dashboard.style.display='block'; 
    render();
  } else { alert('Entre email'); }
}
let cat='neuve';
function setCat(c){
  cat=c;
  t1.classList.toggle('active',c==='neuve');
  t2.classList.toggle('active',c==='occasion');
  catTitle.innerText= c==='neuve' ? 'Ajouter Produit Neuf' : 'Ajouter Produit Occasion';
  render();
}
function getData(){
  // on utilise ta clé existante produits_complets
  let all = JSON.parse(localStorage.getItem('produits_complets')||'[]');
  return all.filter(p=> (p.cat||'neuve')===cat);
}
function getAll(){ return JSON.parse(localStorage.getItem('produits_complets')||'[]'); }
function saveAll(a){ localStorage.setItem('produits_complets', JSON.stringify(a)); }

function ajouter(){
  let n=nom.value.trim(), p=prix.value.trim(), im=img.value.trim()||'https://images.unsplash.com/photo-1529374255404-311a2a4f1fd9?w=400';
  if(!n||!p){ alert('Nom et prix'); return; }
  let all=getAll();
  all.push({nom:n,prix:p,img:im,cat:cat});
  saveAll(all);
  nom.value='';prix.value='';img.value='';
  render();
}
function suppr(indexDansCat){
  // supprime le bon produit dans le tableau global
  let all=getAll();
  let filtrés=getData();
  let item=filtrés[indexDansCat];
  let globalIndex = all.findIndex(x=> x.nom===item.nom && x.prix===item.prix && x.cat===item.cat);
  if(globalIndex>-1){ all.splice(globalIndex,1); saveAll(all); render(); }
}
function afficher(){ render(); } // pour compatibilité avec ton ancien code
function render(){
  let list=getData();
  liste.innerHTML = list.length ? list.map((x,i)=>`<div class="prod"><div><b>${x.nom}</b> - ${x.prix}</div><button onclick="suppr(${i})" style="background:#ff4444;color:#fff;border:0;padding:6px 10px;border-radius:6px;cursor:pointer">X</button></div>`).join('') : 'Aucun produit dans '+cat;
}
</script>
</body>
</html>
