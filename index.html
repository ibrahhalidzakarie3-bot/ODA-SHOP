<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin ODA SHOP</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}.box{max-width:500px;margin:20px auto;background:#fff;padding:20px;border-radius:16px}input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:14px;background:#E9A800;border:0;border-radius:10px;font-weight:800}
</style>
</head>
<body>
<div class="box" id="loginBox"><h3>Admin ODA SHOP</h3><input id="email" placeholder="odashop215@gmail.com"><input id="pass" type="password" placeholder="Mot de passe"><button onclick="login()">Entrer</button></div>
<div class="box" id="adminBox" style="display:none"><h3>Ajouter Produit</h3><input id="nom" placeholder="Nom"><input id="prix" placeholder="Prix"><button onclick="ajouter()">Ajouter</button><div id="liste"></div></div>
<script>
const GMAIL="odashop215@gmail.com"; const MDP="Oda2025";
function login(){ if(email.value.trim()==GMAIL && pass.value==MDP){ loginBox.style.display='none'; adminBox.style.display='block'; afficher(); } else alert('faux'); }
function ajouter(){ let p=JSON.parse(localStorage.getItem('produits_neufs')||'[]'); p.push({nom:nom.value,prix:prix.value}); localStorage.setItem('produits_neufs',JSON.stringify(p)); afficher(); }
function afficher(){ let p=JSON.parse(localStorage.getItem('produits_neufs')||'[]'); liste.innerHTML=p.map(x=>x.nom+' - '+x.prix+'<br>').join(''); }
</script>
</body>
</html>
