<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODA SHOP - Agadez</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, Inter, sans-serif}
body{background:#F2F2F7;display:flex;justify-content:center}
.app{width:100%;max-width:430px;background:#F2F2F7;min-height:100vh;padding:0 16px 100px 16px}

/* HEADER IPHONE 18 */
.top{padding:28px 8px 10px 8px;display:flex;align-items:center;gap:14px}
.logo-diamond{width:42px;height:42px;background:linear-gradient(135deg,#FFC200,#FFB700);border-radius:12px;display:flex;align-items:center;justify-content:center;transform:rotate(0deg);box-shadow:0 8px 20px #FFB70055}
.logo-diamond span{font-size:20px}
.top b{font-size:22px;letter-spacing:-0.5px}
.top b i{color:#FFB700;font-style:normal}
.top small{display:block;font-size:12px;color:#888;margin-top:2px;font-weight:400}

/* SEARCH GLASS */
.search{margin:16px 0;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.8);border-radius:18px;padding:14px 18px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 20px #00000008}
.search input{border:none;outline:none;background:transparent;width:100%;font-size:14px}
.search span{color:#FFB700}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}

/* CARDS LIQUID GLASS IPHONE 18 */
.card{
background:linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);
backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
border:1px solid rgba(255,255,255,0.9);
border-radius:22px;
padding:20px 12px;
text-align:center;
box-shadow:0 8px 24px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,1);
cursor:pointer;
transition:0.2s;
}
.card:active{transform:scale(0.96)}
