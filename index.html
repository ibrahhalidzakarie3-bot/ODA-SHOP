<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Agadez - ODA SHOP</title>
<style>
body{font-family:Arial;background:#FFF8E7;margin:0;padding:20px}
.card{max-width:400px;margin:50px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
h2{text-align:center;color:#FF6B00}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
button{background:#FF6B00;color:white;border:none;font-weight:bold;cursor:pointer}
button:active{opacity:0.8}
.hidden{display:none}
.prod{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between}
</style>
</head>
<body>

<div id="login" class="card">
  <h2>ODA SHOP - Agadez</h2>
  <p style="text-align:center">Admin seulement</p>
  <input type="password" id="pass" placeholder="Mot de passe">
  <button onclick="checkPass()">Entrer</button>
  <p id="err" style="color:red;text-align:center"></p>
</div>

<div id="admin" class="card hidden" style="max-width:500px">
  <h2>Ajouter Produit - Agadez</h2>
  <input type="text" id="name" placeholder="Nom du produit (ex: iPhone 12)">
  <input type="number" id="price" placeholder="Prix en FCFA (ex: 150000)">
  <input type="text" id="image" placeholder="Lien image ou laisse vide">
  <input type="file" id="fileImg" accept="image/*">
  <input type="text" id="city" value="Agadez" readonly style="background:#f5f5f5">
  <button onclick="addProduct()">Ajouter à Agadez</button>
  <button onclick="logout()" style="background:#333;margin-top:20px">Déconnexion</button>
  <hr>
  <h3>Produits Agadez (<span id="count">0</span>)</h3>
  <div id="list"></div>
</div>

<script>
const PASSWORD = "agadez2025";
let products = JSON.parse(localStorage.getItem('oda_agadez_products') || '[]');

function checkPass(){
  if(document.getElementById('pass').value === PASSWORD){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('admin').classList.remove('hidden');
    render();
  } else {
    document.getElementById('err').innerText = "Mot de passe faux !";
  }
}

function addProduct(){
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  const image = document.getElementById('image').value || 'https://via.placeholder.com/300?text=ODA+SHOP';
  if(!name || !price) return alert('Mets nom et prix !');
  
  const p = {id:Date.now(), name, price, image, city:'Agadez', date: new Date().toLocaleDateString()};
  products.unshift(p);
  localStorage.setItem('oda_agadez_products', JSON.stringify(products));
  
  document.getElementById('name').value='';
  document.getElementById('price').value='';
  document.getElementById('image').value='';
  render();
  alert('Produit ajouté à Agadez !');
}

function render(){
  document.getElementById('count').innerText = products.length;
  document.getElementById('list').innerHTML = products.map(p=>`
    <div class="prod"><span><b>${p.name}</b><br>${p.price} FCFA</span><span style="color:red;cursor:pointer" onclick="del(${p.id})">X</span></div>
  `).join('');
}

function del(id){
  products = products.filter(p=>p.id!==id);
  localStorage.setItem('oda_agadez_products', JSON.stringify(products));
  render();
}

function logout(){
  location.reload();
}

// Support image file to base64
document.getElementById('fileImg').addEventListener('change', function(e){
  const reader = new FileReader();
  reader.onload = function(ev){ document.getElementById('image').value = ev.target.result; }
  reader.readAsDataURL(e.target.files[0]);
});
</script>
</body>
</html>
