<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ODA SHOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,Arial,sans-serif;background:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff}
.header .logo img{height:56px}
.header .center{text-align:center;line-height:1.1}
.header .center b{font-size:24px;font-weight:900;color:#000}.header .center b span{color:#E9A800}
.header .center p{color:#555;font-size:16px;margin-top:4px}
.header .right{display:flex;gap:12px}
.circle{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
.c-yellow{background:#E9A800}.c-white{background:#fff;border:2.5px solid #E9A800}
.ville{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid #eee;border-bottom:1px solid #eee;flex-wrap:wrap;gap:10px}
.ville strong{font-size:18px;display:flex;align-items:center;gap:6px}
.btn-ville{background:#E9A800;border:0;padding:13px 20px;border-radius:30px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.search-wrap{padding:14px 16px;border-bottom:1px solid #eee;position:relative}
.search{width:100%;background:#f2f2f2;border:1px solid #e6e6e6;border-radius:30px;padding:18px 18px 18px 54px;font-size:18px}
.search-wrap span{position:absolute;left:36px;top:50%;transform:translateY(-50%);font-size:22px}
.black{margin:18px 16px 0 16px;background:#000;border-radius:20px;padding:18px 20px;color:#fff;display:flex;align-items:center;gap:12px;font-size:17px;position:relative;overflow:hidden}
.black span{color:#E9A800;font-weight:700}
.card{margin:18px 16px;background:#000;border-radius:24px;padding:20px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden;cursor:pointer}
.card::after{content:'';position:absolute;right:-20px;top:-20px;width:180px;height:180px;background:radial-gradient(circle,#3a2a00 0%,transparent 70%);opacity:0.6}
.icon{width:84px;height:84px;background:#E9A800;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:38px;flex-shrink:0;z-index:1}
.card-text{z-index:1}
</style>
</head>
