<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODA SHOP - Agadez</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif}
body{background:#F5F5F7;display:flex;justify-content:center}
.app{width:100%;max-width:440px;background:#F5F5F7;min-height:100vh;padding:0 16px 110px 16px}
.header{text-align:center;padding:30px 0 10px 0}
.header img{width:210px;height:auto;filter:drop-shadow(0 8px 20px #00000010)}
.header small{display:block;margin-top:10px;color:#777;font-size:13px}
.search{margin:18px 0;background:rgba(255,255,255,0.9);backdrop-filter:blur(25px);border:1px solid #fff;border-radius:20px;padding:16px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px #0001}
.search input{border:none;outline:none;background:transparent;width:100%;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(255,255,255,0.65));backdrop-filter:blur(30px);border:1px solid #fff;border-radius:22px;padding:22px 10px;text-align:center;box-shadow:0 10px 30px #0000000D,inset 0 1px 0 #fff;cursor:pointer;transition:.2s}
.card:active{transform:scale(0.96)}
.card .ic{font-size:32px;margin-bottom:10px;color:#FFB700}
.card b{font-size:11px;letter-spacing:.2px}
.card.black{background:linear-gradient(180deg,#1C1C1E,#111);color:white;border-color:#2C2C2E}
.card.yellow{background:linear-gradient(180deg,#FFC200,#FFB700);color:#111;border-color:#FFD23F}
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:420px;background:rgba(255,255,255,0.9);backdrop-filter:blur(25px);border-radius:24px;display:flex;justify-content:space-around;padding:12px 0;box-shadow:0 8px 30px #0002;border:1px solid #fff}
.nav span{font-size:11px;text-align:center}
.nav b{display:block;font-size:18px}
</style>
</head>
<body>
<div class="app">
<div class="header">
<img src="logo.png">
<small>Tout, en un instant • Services premium</small>
</div>

<div class="search">🔍 <input placeholder="Rechercher un service, produit..."> 🎙️</div>

<div class="grid">
<div class="card"><div class="ic">🏪</div><b>BOUTIQUE NEUVE</b></div>
<div class="card"><div class="ic">🛍️</div><b>MARCHÉ OCCASION</b></div>
<div class="card"><div class="ic">🍔</div><b>LIVRAISON NOURRITURE</b></div>
<div class="card"><div class="ic">💊</div><b>PHARMACIE</b></div>
<div class="card"><div class="ic">🏠</div><b>IMMOBILIER</b></div>
<div class="card"><div class="ic">🚌</div><b>TRANSPORT</b></div>
<div class="card yellow"><div class="ic" style="color:#111">🔧</div><b>TRAVAUX DOMICILE</b></div>
<div class="card"><div class="ic" style="color:#111">📦</div><b>SERVICE COLIS</b></div>
<div class="card black"><div class="ic">⚡</div><b>ODA EXPRESS</b></div>
<div class="card"><div class="ic">🚗</div><b>AUTOMOBILE</b></div>
</div>
</div>

<div class="nav">
<span><b>🏠</b>Accueil</span>
<span><b>♡</b>Favoris</span>
<span><b>📋</b>Commandes</span>
<span><b>👤</b>Profil</span>
</div>
</body>
</html>
