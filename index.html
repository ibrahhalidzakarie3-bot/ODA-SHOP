<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique Neuve - ODA SHOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#fff}
.top{background:#0a0f2c;color:#E9A800;padding:12px;text-align:center;font-weight:900}
.wrap{padding:12px 14px}
.prod-img{width:180px}
.prod-img img{width:100%;height:60px;object-fit:cover;display:block}
.stock{color:green;font-size:12px;margin-top:8px;font-weight:700}
.name{font-weight:700;margin-top:4px}
.price{font-weight:900;margin-top:2px}
.btn{background:#2ecc71;color:#fff;border:0;padding:8px 18px;border-radius:6px;margin-top:10px;font-weight:700}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:999}
#zoom.active{display:flex}
#zoom img{max-width:95%;max-height:90vh}
</style>
</head>
<body>
<div class="top">ODA SHOP - BOUTIQUE NEUVE</div>

<div class="wrap">
<h3>Produits Neufs Disponibles</h3>
<p style="font-size:12px;color:#666">1 produits trouvés<br>👆 Clique sur la photo pour zoomer</p>

<div class="prod" onclick="document.getElementById('zoom').classList.add('active');document.getElementById('zImg').src=this.querySelectorAll('img')[0].src">
  <div class="prod-img">
    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300">
    <img src="https://images.unsplash.com/photo-1529374255404-311a2a4f1fd9?w=300">
    <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=300">
    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300">
    <img src="https://images.unsplash.com/photo-1529374255404-311a2a4f1fd9?w=300">
  </div>
  <div class="stock">🟢 En Stock</div>
  <div class="name">chemise</div>
  <div class="price">5000 FCFA</div>
  <button class="btn">🛒 Commander</button>
</div>
</div>

<div id="zoom" onclick="this.classList.remove('active')"><img id="zImg" src=""></div>
</body>
</html>
