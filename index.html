<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f5f5f5}
.top{background:#000;color:#E9A800;padding:14px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
.top a{color:#E9A800;text-decoration:none;border:1px solid #E9A800;padding:6px 14px;border-radius:20px;font-size:13px}

.price{font-weight:900;font-size:15px;margin-top:4px}
.btns{display:flex;gap:6px;margin-top:10px}
.btn{flex:1;padding:11px;border-radius:8px;text-align:center;text-decoration:none;font-weight:900;font-size:13px}
.btn-cmd{background:#25D366;color:#fff}
.btn-share{background:#fff;color:#000;border:2px solid #000}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:999}
.zoom img{max-width:96%;max-height:96%;border-radius:10px}
.empty{grid-column:1/-1;padding:50px;text-align:center;color:#999}
