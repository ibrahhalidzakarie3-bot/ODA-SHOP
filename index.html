<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODA SHOP - Agadez</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#F6F6F6;display:flex;justify-content:center}
.app{width:100%;max-width:430px;background:white;min-height:100vh;position:relative;padding-bottom:80px}
.header{padding:20px;display:flex;justify-content:center;background:white;box-shadow:0 1px 10px #0001;position:sticky;top:0;z-index:5}
.header img{height:70px}
.search{margin:12px 16px;background:#F2F2F2;border-radius:12px;padding:12px;display:flex;gap:8px}
.search input{border:none;background:transparent;width:100%;outline:none}
.list{padding:0 16px;display:flex;flex-direction:column;gap:16px;margin-top:10px}
.card{display:flex;gap:14px;align-items:center;background:white;border:1px solid #EAEAEA;border-radius:14px;padding:16px;box-shadow:0 4px 12px #0000000A;cursor:pointer}
.card:active{transform:scale(0.98)}
.card .ico{width:44px;height:44px;background:#FFF7D6;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.card b{font-size:12.5px} .card small{color:#888;font-size:11px}
.num{margin-left:auto;background:#111;color:#FFB700;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}

/* PAGE DETAIL */
.detail{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:100vh;background:white;z-index:20;display:none;flex-direction:column;overflow:auto}
.detail.active{display:flex}
.detail-head{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;position:sticky;top:0;background:white}
.detail-head button{border:none;background:#111;color:#FFB700;width:36px;height:36px;border-radius:10px;font-size:18px}
.subs{padding:16px;display:grid;gap:10px}
.sub{background:#F8F8F8;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;border:1px solid #eee}
.sub:active{background:#FFFBEB}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
</style>
</head>
<body>
<div class="app">
<div class="header"><img src="logo.png"></div>
<div class="search">🔍<input placeholder="Rechercher service..."></div>
<div class="list" id="list"></div>
</div>

<div class="detail" id="detail">
<div class="detail-head"><button onclick="closeDetail()">‹</button><b id="detailTitle"></b></div>
<div class="subs" id="subs"></div>
</div>

<div class="nav">🏠 Accueil</div>
