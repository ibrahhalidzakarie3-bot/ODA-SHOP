<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODA SHOP NIGER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1c2e;display:flex;justify-content:center;min-height:100vh;font-family:Arial}
.app{width:390px;background:#0f1c2e;padding:25px;position:relative}
.logo{display:flex;align-items:center;gap:10px;color:white}
.circle{background:#1e344f;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#ffcc4d;text-align:center}
.logo b{color:#ffcc4d;font-size:11px}
.logo span{font-size:11px;color:#8a9bb5}
h1{color:white;font-size:28px;margin-top:35px;line-height:1.2}
h1 span{color:#ffcc4d}
.desc{color:#8a9bb5;font-size:13px;margin:12px 0 30px;line-height:1.4}
label{color:#ffcc4d;font-size:11px;font-weight:bold;letter-spacing:1px;margin-top:20px;display:block}
input,select{width:100%;padding:14px 18px;margin-top:8px;border-radius:25px;border:1px solid #233a5a;background:#142541;color:white;outline:none;font-size:14px}
select{color:#8a9bb5}
.btn{width:100%;padding:16px;background:#ffcc4d;color:#0f1c2e;border:none;border-radius:25px;font-weight:800;letter-spacing:1px;margin-top:30px;font-size:14px}
.foot{color:#4a5f7e;font-size:10px;text-align:center;margin-top:25px}
.bg-text{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:85px;font-weight:900;color:rgba(255,255,255,0.04);line-height:0.9;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div class="app">
<div class="bg-text">ODA<br>SHOP</div>
<div class="logo"><div class="circle">ODA<br>SHOP</div><div><b>ODA SHOP</b><br><span>Niger</span></div></div>
<h1>Bienvenue sur <span>ODA SHOP</span></h1>
<p class="desc">Dites-nous qui vous êtes et où vous êtes, pour voir les produits livrables dans votre ville.</p>

<label>NOM ET PRÉNOM</label>
<input type="text" placeholder="Mettez votre nom prénom">

<label>DANS QUELLE VILLE ES-TU ?</label>
<select>
<option>Dans quelle ville es-tu ?</option>
<option>Agadez</option>
<option>Diffa</option>
<option>Dosso</option>
<option>Maradi</option>
<option>Tahoua</option>
<option>Tillabéri</option>
<option>Zinder</option>
<option>Niamey</option>
</select>

<button class="btn">COMMENCER</button>
<p class="foot">Vos infos restent enregistrées sur votre téléphone.</p>
</div>
</body>
</html>
