<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique Neuve - ODA Shop Niger</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f5f5f5}
.header{padding:14px;background:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.header b{font-size:20px}
.btn-retour{background:#000;color:#E9A800;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 5px rgba(0,0,0,0.08)}
.card img{width:100%;height:170px;object-fit:cover;border-radius:12px;background:#eee}
.card h3{font-size:15px;margin:8px 0 4px}
.desc{font-size:12px;color:#666;margin-bottom:4px;min-height:18px}
.price{color:green;font-weight:900;font-size:15px}
.stock{font-size:11px;color:#888;margin:4px 0}
.btn-cmd{background:#000;color:#E9A800;border:0;padding:10px;border-radius:25px;width:100%;font-weight:800;margin-top:6px;cursor:pointer}
.loading{text-align:center;padding:40px;color:#666}
</style>
</head>
<body>
<div class="header"><b>🏪 BOUTIQUE NEUVE</b><a href="index.html" class="btn-retour">← Accueil</a></div>
<div id="shop" class="loading">Chargement du stock ODA Shop Niger...<br>Connecté à Google Sheet...</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyfuAKsPbozLAV-2jaqOrs3UxqmB1j6o_w0HUO2bNDOtIPAcC6ydkKF3VIU7VKky-vc/exec";
async function loadShop(){
 try{
  const r = await fetch(API_URL);
  const products = await r.json();
  const shop = document.getElementById('shop');
  if(!products || products.length===0){
    shop.innerHTML='<div class="loading">Aucun produit dans Google Sheet. Ajoute dans ton Sheet.</div>';
    return;
  }
  shop.className='grid';
  shop.innerHTML='';
  products.forEach(p=>{
    if(!p.nom) return;
    if(p.quantite!==undefined && Number(p.quantite)<=0) return;
    shop.innerHTML+=`
      <div class="card">
        <img src="${p.image||'https://via.placeholder.com/300x300?text=ODA+Shop'}" alt="">
        <h3>${p.nom}</h3>
        <div class="desc">${p.description||''}</div>
        <div class="price">${p.prix||0} FCFA</div>
        <div class="stock">Stock: ${p.quantite||''} | Taille: ${p.taille||''}</div>
        <button class="btn-cmd" onclick="window.open('https://wa.me/22777174950?text=Salam ODA Shop, je veux commander: ${encodeURIComponent(p.nom)} - ${p.prix} FCFA','_blank')">Commander WhatsApp</button>
      </div>`;
  });
 }catch(e){
  document.getElementById('shop').innerHTML='<div class="loading">Erreur chargement. Vérifie que ton Google Sheet est publié.<br><br>'+e+'</div>';
 }
}
loadShop();
</script>
</body>
</html>
