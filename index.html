<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODA SHOP Agadez</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#FFF8E7}
header{background:#FF6B00;color:white;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:white;border-radius:15px;padding:20px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.1);cursor:pointer}
.card h3{margin:10px 0 0}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.prod{background:white;border-radius:12px;padding:10px;text-align:center}
.prod img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.btn{width:100%;background:#25D366;color:white;padding:12px;border:none;border-radius:8px;font-weight:bold;margin-top:8px}
.hidden{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:white}
</style>
</head>
<body>
<header><h2 style="margin:0">ODA SHOP - Agadez</h2><small>Ville : Agadez</small></header>

<div id="home">
  <div class="grid">
    <div class="card" onclick="showPage('neuve')"><div style="font-size:40px">📱</div><h3>Boutique Neuve</h3><small id="c-neuve">0 produits</small></div>
    <div class="card" onclick="showPage('occasion')"><div style="font-size:40px">♻️</div><h3>Marché Occasion</h3><small id="c-occ">0 produits</small></div>
    <div class="card" onclick="showPage('food')"><div style="font-size:40px">🍛</div><h3>Livraison Nourriture</h3></div>
    <div class="card" onclick="showPage('pharma')"><div style="font-size:40px">💊</div><h3>Pharmacie</h3></div>
  </div>
</div>

<div id="page-neuve" class="hidden"><div class="topbar"><button onclick="showPage('home')">← Accueil</button><b>Boutique Neuve</b><span></span></div><div id="list-neuve" class="prod-grid"></div></div>
<div id="page-occasion" class="hidden"><div class="topbar"><button onclick="showPage('home')">← Accueil</button><b>Marché Occasion</b><span></span></div><div id="list-occasion" class="prod-grid"></div></div>

<div id="page-food" class="hidden">
  <div class="topbar"><button onclick="showPage('home')">← Accueil</button><b>Livraison Nourriture</b><span></span></div>
  <div style="padding:15px">
    <select id="resto" style="width:100%;padding:12px;border-radius:8px"><option>Restaurant Taghlamt</option><option>Restaurant Agadez</option><option>Chez Binta</option></select>
    <input id="plat" placeholder="Quel plat tu veux ? Ex: Riz + poulet" style="width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ddd">
    <input id="nom" placeholder="Ton nom" style="width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ddd">
    <input id="quartier" placeholder="Ton quartier à Agadez" style="width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ddd">
    <button class="btn" onclick="commanderFood()">Commander sur WhatsApp 77 17 49 50</button>
  </div>
</div>

<div id="page-pharma" class="hidden"><div class="topbar"><button onclick="showPage('home')">← Accueil</button><b>Pharmacie</b><span></span></div><p style="text-align:center;padding:20px">Bientôt disponible - Contact 77 17 49 50</p></div>

<script>
let products = JSON.parse(localStorage.getItem('oda_products') || '[]');
function showPage(p){
  document.querySelectorAll('[id^="page-"],#home').forEach(e=>e.classList.add('hidden'));
  if(p==='home') document.getElementById('home').classList.remove('hidden');
  else{ document.getElementById('page-'+p).classList.remove('hidden'); if(p==='neuve'||p==='occasion') renderProds(); }
}
function renderProds(){
  const neuve = products.filter(x=>x.type==='neuve');
  const occ = products.filter(x=>x.type==='occasion');
  document.getElementById('c-neuve').innerText = neuve.length+' produits';
  document.getElementById('c-occ').innerText = occ.length+' produits';
  document.getElementById('list-neuve').innerHTML = neuve.map(pr=>`
    <div class="prod"><img src="${pr.image}"><b>${pr.name}</b><br><small>${pr.cat}</small><br><b style="color:#FF6B00">${pr.price} FCFA</b><br><button class="btn" onclick="buyWa('${pr.name}','${pr.price}')">Commander</button></div>`).join('') || '<p>Aucun produit neuf pour le moment</p>';
  document.getElementById('list-occasion').innerHTML = occ.map(pr=>`
    <div class="prod"><img src="${pr.image}"><b>${pr.name}</b><br><small>${pr.cat}</small><br><b style="color:#FF6B00">${pr.price} FCFA</b><br><button class="btn" onclick="buyWa('${pr.name}','${pr.price}')">Commander</button></div>`).join('') || '<p>Aucun produit occasion pour le moment</p>';
}
function buyWa(nom,prix){
  const msg = `Bonjour ODA SHOP Agadez, je veux commander: ${nom} à ${prix} FCFA`;
  window.open(`https://wa.me/22777174950?text=${encodeURIComponent(msg)}`,'_blank');
}
function commanderFood(){
  const r=document.getElementById('resto').value, p=document.getElementById('plat').value, nom=document.getElementById('nom').value, q=document.getElementById('quartier').value;
  if(!p) return alert('Mets le plat que tu veux !');
  const msg = `Bonjour ODA SHOP, je veux commander:\nRestaurant: ${r}\nPlat: ${p}\nNom: ${nom}\nQuartier: ${q}\nVille: Agadez`;
  window.open(`https://wa.me/22777174950?text=${encodeURIComponent(msg)}`,'_blank');
}
renderProds();
</script>
</body>
</html>
