<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ODA SHOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff}
.header .logo img{height:50px}
.header .mid{text-align:center;line-height:1.2}
.header .mid b{font-size:22px;font-weight:800;color:#000}
.header .mid b span{color:#E9A800}
.header .mid p{font-size:16px;color:#555;margin-top:2px}
.header .right{display:flex;gap:12px}
.circle{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
.circle.yellow{background:#E9A800}
.circle.white{background:#fff;border:2px solid #E9A800}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;flex-wrap:wrap;gap:10px}
.bar strong{font-size:18px;display:flex;align-items:center;gap:6px}
.btn-city{background:#E9A800;border:0;padding:12px 18px;border-radius:24px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.search-wrap{padding:16px}
.search{width:100%;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:30px;padding:16px 16px 16px 50px;font-size:17px}
</style>
</head>
<body>
<div class="header">
 <div class="logo"><img src="logo.png" alt="ODA SHOP"></div>
 <div class="mid"><b>Bienvenue <span>Zara</span></b><p>Agadez</p></div>
 <div class="right"><div class="circle yellow">📞</div><div class="circle white">☰</div></div>
</div>
<div class="bar"><strong>📍 Ville : Agadez</strong><button class="btn-city">👜 📍 Commander vers une autre ville</button></div>
<div class="search-wrap"><input class="search" placeholder="Que cherchez-vous ?"></div>
</body>
</html>
