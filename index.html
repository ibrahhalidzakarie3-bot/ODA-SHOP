<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boutique Neuve - ODA SHOP</title>
<style>body{font-family:Arial;background:#fff;margin:0}.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}.grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}} .card{border:1px solid #eee;border-radius:16px;padding:12px;overflow:hidden}.card img{width:100%;height:160px;object-fit:cover;border-radius:12px}.price{color:#E9A800;font-weight:900;font-size:18px}.btn{ display:block;background:#000;color:#fff;text-align:center;padding:12px;border-radius:22px;text-decoration:none;margin-top:8px;font-weight:800}</style>
</head>
<body>
<div class="top"><a href="index.html" style="text-decoration:none;color:#000">← Retour</a><b>BOUTIQUE NEUVE</b><a href="tel:+22777174950" style="text-decoration:none">📞</a></div>
<div id="list" class="grid"></div>
<script>
let arr=JSON.parse(localStorage.getItem('produits_complets')||'[]');
let el=document.getElementById('list');
if(arr.length==0) el.innerHTML='<div style="text-align:center;padding:40px;color:#888;grid-column:1/-1">Aucun produit pour le moment<br><small>Ajoute dans Admin</small></div>';
else el.innerHTML=arr.filter(p=>p.statut!=='vendu').map(p=>`
<div class="card">
 ${p.photo?`<img src="${p.photo}">`:`<div style="height:160px;background:#f5f5f5;border-radius:12px;display:flex;align-items:center;justify-content:center">📦</div>`}
 <div style="margin-top:8px"><b>${p.nom}</b></div>
 <div style="font-size:12px;color:#666;margin:4px 0">${p.desc||''}</div>
 <div class="price">${p.prixVente} FCFA</div>
 <div style="font-size:11px;color:#00a651;margin-top:2px">${p.statut}</div>
 <a class="btn" href="https://wa.me/22777174950?text=Salam%20ODA%20SHOP%20je%20veux%20commander%20${encodeURIComponent(p.nom)}%20à%20${p.prixVente}FCFA">Commander</a>
</div>`).join('');
</script>
</body>
</html>
