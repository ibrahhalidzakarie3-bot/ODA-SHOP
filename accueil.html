<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - ODA SHOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:white;min-height:100vh;padding:24px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:50px}
.logo-box{background:#121212;border-radius:12px;padding:10px 12px;font-weight:900}
.top-text b{color:#f5b731;display:block;font-size:14px}
.top-text p{font-size:13px;color:#888}
h1{font-size:36px;font-weight:900;margin-bottom:16px}
h1 span{color:#f5b731}
.sub{color:#777;font-size:15px;margin-bottom:35px}
.label{color:#f5b731;font-size:11px;font-weight:800;letter-spacing:1.5px;margin-bottom:10px;display:block}
.input{width:100%;background:#111;border:1px solid #222;border-radius:30px;padding:18px 20px;color:white;margin-bottom:28px}
.btn{width:100%;background:#f5b731;color:black;border:none;border-radius:30px;padding:20px;font-weight:900}
</style>
</head>
<body>
<img src="logo.png" style="width:50px; height:50px; border-radius:12px; object-fit:cover;"><div class="top-text"><b>ODA SHOP</b><p>Agadez · Niger</p></div></div>
<h1>Bienvenue sur<br><span>ODA SHOP</span></h1>
<p class="sub">Dites-nous qui vous êtes et où vous êtes, pour voir les produits livrables dans votre ville.</p>
<span class="label">NOM ET PRÉNOM</span>
<input class="input" id="nom" placeholder="Mettez votre nom">
<span class="label">DANS QUELLE VILLE ES-TU ?</span>
<input class="input" id="ville" placeholder="Ex: Agadez">
<button class="btn" onclick="goAccueil()">COMMENCER</button>
<script>
function goAccueil(){
  const nom = document.getElementById('nom').value.trim();
  const ville = document.getElementById('ville').value.trim();
  if(!nom || !ville){alert('ABEE mets ton nom et ta ville !');return;}
  localStorage.setItem('oda_nom', nom);
  localStorage.setItem('oda_ville', ville);
  window.location.href = './index.html';
}
</script>
</body>
</html>
