<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livraison</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f5f5f5}.top{background:#E9A800;padding:14px;display:flex;justify-content:space-between;font-weight:900}.top a{text-decoration:none;color:#000;border:1px solid #000;padding:6px 14px;border-radius:20px;background:#fff;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}.resto{background:#fff;border-radius:18px;padding:16px;text-align:center;border:2px solid #000;cursor:pointer}.resto b{font-size:17px;display:block;margin-bottom:4px}.resto span{font-size:12px;color:#666}.box{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;padding:16px;z-index:99;overflow:auto}.form{background:#fff;border-radius:20px;padding:18px;max-width:420px;margin:auto}.form input,.form textarea{width:100%;padding:14px;border-radius:10px;border:1.5px solid #ddd;margin-bottom:10px;font-size:15px}.form textarea{min-height:80px}.btn{width:100%;padding:16px;border-radius:12px;border:0;font-weight:900;font-size:16px;cursor:pointer}.green{background:#25D366;color:#fff;margin-top:8px}.black{background:#000;color:#fff;margin-top:8px}label{font-size:13px;font-weight:700;margin-bottom:4px;display:block}</style></head><body><div class="top"><a href="index.html">← Retour</a><div>🍔 LIVRAISON</div><div style="width:60px"></div></div><div style="padding:14px"><b>Choisis restaurant Agadez :</b></div><div class="grid"><div class="resto" onclick="openF('Otakos')"><b>🍛 Otakos</b><span>Grills Poulets</span></div><div class="resto" onclick="openF('Saharaland')"><b>🏜️ Saharaland</b><span>Pizzas Burgers</span></div><div class="resto" onclick="openF('Imarrah')"><b>🍕 Imarrah</b><span>Fast Food</span></div><div class="resto" onclick="openF('Le Pilier')"><b>🥘 Le Pilier</b><span>Africain</span></div><div class="resto" onclick="openF('Taj Mahal')"><b>🍗 Taj Mahal</b><span>Indien</span></div><div class="resto" onclick="openF('Autre')"><b>✏️ Autre</b><span>Ecris nom</span></div></div><div class="box" id="box"><div class="form"><h2 id="titre">Commander</h2><label>Restaurant</label><input id="fResto"><label>Nom Prenom *</label><input id="fNom" placeholder="Ton nom"><label>Telephone *</label><input id="fTel" placeholder="90 XX XX XX"><label>Quartier *</label><input id="fQuartier" placeholder="Sabon Gari, Toudou..."><label>Plat / Menu *</label><textarea id="fPlat" placeholder="Ex: 2 poulets + frites + coca"></textarea><label>Specialite</label><textarea id="fNote" placeholder="Sans oignon, pas pimente..."></textarea><button class="btn green" onclick="cmd()">📲 COMMANDER 77174950</button><button class="btn black" onclick="document.getElementById('box').style.display='none'">Fermer</button></div></div><script>function openF(n){document.getElementById('titre').innerText='Commander chez '+n;document.getElementById('fResto').value=n;document.getElementById('box').style.display='block';}function cmd(){let r=document.getElementById('fResto').value.trim();let nm=document.getElementById('fNom').value.trim();let tl=document.getElementById('fTel').value.trim();let q=document.getElementById('fQuartier').value.trim();let p=document.getElementById('fPlat').value.trim();let nt=document.getElementById('fNote').value.trim();if(!nm||!tl||!q||!p){alert('Remplis Nom, Tel, Quartier, Plat');return;}let m='*COMMANDE NOURRITURE ODA*%0A%0A🍔 Resto: '+r+'%0A👤 Client: '+nm+'%0A📞 Tel: '+tl+'%0A📍 Quartier: '+q+'%0A%0A🍛 Plat:%0A'+p+'%0A%0A📝 Note: '+(nt||'Aucune');window.open('https://wa.me/22777174950?text='+encodeURIComponent(m),'_blank');document.getElementById('box').style.display='none';}</script></body></html>
