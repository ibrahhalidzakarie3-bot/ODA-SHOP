<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Agadez - ODA SHOP</title>
<style>
body{ background:black; color:white; font-family:sans-serif; margin:0; }
header{ border-bottom:1px solid gold; padding:15px; position:sticky; top:0; background:black; }
.tab{ padding:8px 15px; border-radius:20px; border:1px solid #444; background:black; color:#ccc; margin:2px; cursor:pointer; }
.tab.active{ background:gold; color:black; font-weight:bold; }
.card{ border:1px solid #222; background:#111; padding:12px; border-radius:12px; margin:8px 0; display:flex; gap:10px; }
.gold{ color:gold; }
.btn-gold{ background:gold; color:black; font-weight:900; padding:14px; border-radius:12px; width:100%; border:none; cursor:pointer; text-transform:uppercase; }
input{ background:black; border:1px solid #555; color:white; padding:10px; border-radius:8px; width:100%; margin:5px 0; }
</style>
</head>
<body>
<header>
<h2 style="color:gold;">📍 Admin Agadez - ODA SHOP</h2>
<div id="tabs">
<button class="tab active" onclick="showTab('boutique')">Boutique Neuve</button>
<button class="tab" onclick="showTab('marketplace')">Marketing Occasion</button>
<button class="tab" onclick="showTab('commandes')">Commandes (<span id="countCmd">0</span>)</button>
<button class="tab" onclick="showTab('oda_gaz')">Oda Gaz</button>
<button class="tab" onclick="showTab('patisserie')">Pâtisserie</button>
<button class="tab" onclick="showTab('automobile')">Automobile</button>
</div>
</header>

<main style="padding:15px;">
<input id="search" placeholder="Rechercher code, nom, téléphone..." oninput="filtrer()">

<button class="btn-gold" onclick="ajouterProduit()">+ Ajouter produit neuf</button>

<div id="liste-produits" style="margin-top:20px;">
<!-- Tes produits vont s'afficher ici -->
</div>

<!-- Formulaire caché -->
<div id="formProduit" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#111; border-top:2px solid gold; padding:20px; max-height:90vh; overflow:auto;">
<h3 class="gold">Ajouter Produit Agadez</h3>
<label>Nom marchandise <input id="f_nom"></label>
<label>Prix achat <input id="f_achat" type="number"></label>
<label>Prix vente <input id="f_vente" type="number"></label>
<label>Vendeur <input id="f_vendeur"></label>
<label>Téléphone vendeur <input id="f_tel"></label>
<label>Photo (lien) <input id="f_photo"></label>
<label>Section 
<select id="f_section" style="background:black; color:white; padding:10px; width:100%; border-radius:8px;">
<option value="boutique">Boutique Neuve</option>
<option value="marketplace">Marché Occasion</option>
<option value="oda_gaz">Oda Gaz</option>
<option value="patisserie">Pâtisserie</option>
<option value="automobile">Automobile</option>
</select>
</label>
<div style="display:flex; gap:10px; margin-top:15px;">
<button onclick="fermerForm()" style="flex:1; padding:12px; background:#333; color:white; border-radius:8px; border:none;">Annuler</button>
<button onclick="enregistrer()" class="btn-gold" style="flex:1;">Enregistrer</button>
</div>
</div>
</main>

<script>
// Données locales - pas besoin de mot de passe Supabase
let produits = JSON.parse(localStorage.getItem('oda_agadez')||'[]');
let tabActuel = 'boutique';

function showTab(t){ 
  tabActuel=t; 
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  afficher();
}

function afficher(){
  let q=document.getElementById('search').value.toLowerCase();
  let div=document.getElementById('liste-produits');
  let filtres=produits.filter(p=>{
    if(tabActuel!=='commandes' && p.section!==tabActuel) return false;
    if(!q) return true;
    return (p.nom+p.code+p.vendeur).toLowerCase().includes(q);
  });
  document.getElementById('countCmd').innerText=produits.length;
  if(filtres.length===0){ div.innerHTML='<p style="text-align:center; color:#666; padding:20px;">Aucune marchandise Agadez.</p>'; return; }
  div.innerHTML=filtres.map(p=>`
    <div class="card">
      <img src="${p.photo||'https://via.placeholder.com/60'}" style="width:56px; height:56px; border-radius:8px; object-fit:cover;">
      <div style="flex:1;">
        <span style="background:#332c00; color:gold; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">${p.code}</span>
        <p style="margin:4px 0; font-weight:bold;">${p.nom}</p>
        <p class="gold">${p.vente} FCFA</p>
        <p style="font-size:11px; color:#aaa;">Vendeur: ${p.vendeur} - ${p.tel}</p>
      </div>
      <button onclick="supprimer('${p.id}')" style="background:none; border:1px solid red; color:red; border-radius:6px; padding:4px 8px; height:30px;">Supprimer</button>
    </div>
  `).join('');
}

function ajouterProduit(){ document.getElementById('formProduit').style.display='block'; }
function fermerForm(){ document.getElementById('formProduit').style.display='none'; }

function enregistrer(){
  let codePrefix={boutique:'AGZ-B', marketplace:'AGZ-M', oda_gaz:'AGZ-G', patisserie:'AGZ-P', automobile:'AGZ-A'}[document.getElementById('f_section').value];
  let num=produits.filter(p=>p.code.startsWith(codePrefix)).length+1;
  let code=codePrefix+'-'+String(num).padStart(3,'0');
  let nouveau={
    id:Date.now().toString(),
    code:code,
    nom:document.getElementById('f_nom').value||'Oda Gaz',
    achat:document.getElementById('f_achat').value,
    vente:document.getElementById('f_vente').value,
    vendeur:document.getElementById('f_vendeur').value,
    tel:document.getElementById('f_tel').value,
    photo:document.getElementById('f_photo').value,
    section:document.getElementById('f_section').value
  };
  produits.unshift(nouveau);
  localStorage.setItem('oda_agadez', JSON.stringify(produits));
  fermerForm(); afficher();
  alert('Produit '+code+' enregistré à Agadez!');
}

function supprimer(id){
  if(!confirm('Supprimer cette marchandise?')) return;
  produits=produits.filter(p=>p.id!==id);
  localStorage.setItem('oda_agadez', JSON.stringify(produits));
  afficher();
}
function filtrer(){ afficher(); }
afficher();
</script>
</body>
</html>
