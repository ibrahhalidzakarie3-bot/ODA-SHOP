<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique Neuve</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f5f5f5}
.top{background:#E9A800;padding:14px;display:flex;justify-content:space-between;font-weight:900;border-bottom:2px solid #000}
.top a{text-decoration:none;color:#000;border:1px solid #000;padding:6px 14px;border-radius:20px;font-size:13px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ddd}
.card img{width:100%;height:200px;object-fit:cover;cursor:zoom-in}
.info{padding:10px}
.badge{background:#E9A800;color:#000;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:900}
.price{font-weight:900;font-size:16px;margin-top:6px}
.btns{display:flex;gap:6px;margin-top:10px}
.btn{flex:1;padding:12px;border-radius:8px;text-align:center;text-decoration:none;font-weight:900;font-size:13px}
.cmd{background:#25D366;color:#fff}.share{background:#fff;color:#000;border:2px solid #000}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:999}
.zoom img{max-width:95%;max-height:95%}
</style>
</head>
<body>
<div class="top"><a href="index.html">← Retour</a><div>BOUTIQUE NEUVE</div><div style="width:60px"></div></div>
<div class="grid" id="grid"></div>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img id="zImg"></div>
<script>
function get(){try{return JSON.parse(localStorage.getItem('produits_complets')||'[]')}catch{return[]}}
function show(){
 let all=get().filter(p=>p.cat==='neuve');
 let g=document.getElementById('grid');
 if(!all.length){g.innerHTML='<div style="grid-column:1/-1;padding:60px;text-align:center">Aucun produit neuf<br>Va dans admin.html<br>et ajoute catégorie = neuve</div>';return;}
 g.innerHTML=all.map(p=>{
  let col=p.statut==='En Stock'?'green':p.statut==='Vendue'?'red':'orange';
  let num=p.numero||'001';
  return `<div class=card>
   <img src="${p.photo||''}" onclick="document.getElementById('zImg').src=this.src;document.getElementById('zoom').style.display='flex'">
   <div class=info>
    <span class=badge>#${num}</span> <span style="color:${col};font-size:11px;font-weight:900">${p.statut||'En Stock'}</span>
    <div style="font-weight:800;margin-top:6px">${p.nomMarch||''}</div>
    <div style="font-size:12px;color:#666">${p.description||''}</div>
    <div class=price>${p.pVente||''} FCFA</div>
    <div class=btns>
     <a class="btn cmd" href="https://wa.me/22777174950?text=ODA SHOP NEUF - N°${num} ${p.nomMarch} ${p.pVente}FCFA">Commander</a>
     <a class="btn share" href="#" onclick="window.open('https://wa.me/?text='+encodeURIComponent('ODA SHOP NEUF N°${num} - ${p.nomMarch} - ${p.pVente} FCFA'),' _blank');return false;">↗️ Partager</a>
    </div>
   </div>
  </div>`;
 }).join('');
}
show();
</script>
</body>
</html>
