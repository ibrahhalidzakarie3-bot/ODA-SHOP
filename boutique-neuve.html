<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODA SHOP AGADEZ - NEUF</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}
h1{text-align:center;color:#0a7d2e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,0.2)}
.card img{width:100%;height:220px;object-fit:cover;background:#eee;cursor:zoom-in}
.info{padding:10px}
.price{color:#e60000;font-weight:bold;font-size:18px}
.desc{font-size:13px;color:#555}
.btn{display:block;background:#25D366;color:white;text-align:center;padding:12px;border-radius:10px;text-decoration:none;margin-top:8px;font-weight:bold}
#status{text-align:center;padding:12px;background:#d4edda;border-radius:8px;margin:10px;color:#155724;font-weight:bold}
#zoom{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:999}
#zoom img{max-width:95%;max-height:95%;border-radius:10px}
</style>
</head>
<body>
<h1>ODA SHOP AGADEZ - NEUF</h1>
<div id="status">Chargement ABEE...</div>
<div class="grid" id="grid"></div>
<div id="zoom" onclick="this.style.display='none'"><img id="zoomImg"></div>
<script>
const SHEET_ID="1895VPzGc3iNWS7psJNQUNBP0MjVy_PvncEkapwnNbFQ";
const URL_CSV=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

function driveToDirect(link){
 if(!link) return "https://via.placeholder.com/300x300?text=ODA+SHOP";
 let id="";
 if(link.includes("/d/")){ id=link.split("/d/")[1].split("/")[0]; }
 else if(link.includes("id=")){ id=link.split("id=")[1].split("&")[0]; }
 if(id) return `https://drive.google.com/uc?export=view&id=${id}`;
 return link;
}

async function load(){
 try{
  const res=await fetch(URL_CSV);
  const txt=await res.text();
  const rows=txt.split("\n");
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  let c=0;
  for(let i=1;i<rows.length;i++){
   if(!rows[i].trim()) continue;
   // sépare CSV avec gestion des virgules dans guillemets
   const cols=rows[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
   if(!cols||cols.length<3) continue;
   const nom=cols[1]?cols[1].replace(/"/g,"").trim():"";
   const prix=cols[2]?cols[2].replace(/"/g,"").trim():"";
   const photoRaw=cols[3]?cols[3].replace(/"/g,"").trim():"";
   const desc=cols[4]?cols[4].replace(/"/g,"").trim():"";
   const approuve=cols[5]?cols[5].replace(/"/g,"").trim().toLowerCase():"oui";
   
   if(!nom) continue;
   if(approuve && approuve!=="oui" && approuve!=="o") continue;
   
   c++;
   const photo=driveToDirect(photoRaw);
   grid.innerHTML+=`
   <div class="card">
    <img src="${photo}" onerror="this.src='https://via.placeholder.com/300x300?text=${nom}'" onclick="zoom(this.src)">
    <div class="info">
     <b>${nom}</b><br>
     <span class="desc">${desc}</span>
     <div class="price">${prix} FCFA</div>
     <a class="btn" href="https://wa.me/227XXXXXXXX?text=Salam ABEE, je veux ${encodeURIComponent(nom)} - ${prix} FCFA">Commander WhatsApp</a>
    </div>
   </div>`;
  }
  document.getElementById("status").innerHTML=`✅ ${c} produits approuvés - C'est bon ABEE ! Clique sur une photo pour ZOOM`;
 }catch(e){
  document.getElementById("status").innerHTML="❌ Erreur: "+e.message;
 }
}
function zoom(src){document.getElementById("zoomImg").src=src;document.getElementById("zoom").style.display="flex";}
load();
</script>
</body>
</html>
